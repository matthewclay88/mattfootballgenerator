name: Update player data

on:
  schedule:
    # Every Tuesday at 09:00 UTC (Mon night/Tues morning US time),
    # after MNF stats are final. Adjust as you like.
    - cron: "0 9 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch data and build player parameters
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/players.json
          git diff --staged --quiet || git commit -m "Update player data ($(date -u +%Y-%m-%d))"
          git push
